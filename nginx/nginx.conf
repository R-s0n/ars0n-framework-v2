events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------------------------
    # LOGGING - deliberately on. The previous settings were `access_log off;` and
    # `error_log /var/log/nginx/error.log crit;`, and that pair is why the stale-upstream 502
    # described below took real time to diagnose: nginx logs a 502 at `error` level, which is BELOW
    # `crit`, so the error log silently discarded it, and with the access log off there was no
    # request line either. The container emitted nothing at all while every page load was failing,
    # so the outage had to be tracked down by comparing container IPs by hand. (Confirmed: the
    # nginx container's logs contained only docker-entrypoint boilerplate, no request or error
    # lines, despite having served traffic.)
    #
    # A 5xx must always leave a trace. Access logging stays ON rather than off-for-volume: this is a
    # single-operator local tool listening on one host's port 80, not a public edge, so the volume
    # is trivial and seeing a failing request is worth far more than the bytes.
    #
    # $upstream_addr and $upstream_status are in the format on purpose - they are what makes the
    # next upstream problem self-diagnosing, because the line shows the exact upstream IP:port nginx
    # tried and what came back, instead of a bare "502" with no context. In the stale-upstream case
    # the logged $upstream_addr is the dead container's old IP, which names the bug outright.
    # Both log files are symlinks to /dev/stdout and /dev/stderr in the nginx:alpine image (verified
    # inside the running container), so this lands in `docker logs ars0n-framework-v2-nginx-1`.
    # ---------------------------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log error;

    sendfile on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------------------------
    # RUNTIME DNS - this is the fix for the recurring 502.
    #
    # THE BUG: this file used to declare `upstream api { server api:8443; }` and
    # `upstream client { server client:3000; }`. nginx resolves the hostname in an `upstream` block
    # ONCE, when the config is loaded, and caches that address for the life of the process. Any time
    # the api or client container is recreated - which `docker compose up -d --build --no-deps
    # client` does routinely - Docker hands it a NEW IP on the bridge network while nginx keeps
    # proxying to the container that no longer exists. Result: a hard 502 on every request until
    # somebody restarts nginx. The failure is also asymmetric, which makes it more confusing:
    # recreating only the client breaks `/` while `/api/*` keeps working, because the api container
    # kept its address.
    #
    # Measured, not assumed: `nginx -t` on the OLD config with these names unresolvable fails with
    # `host not found in upstream "api:8443"`, while this config passes the same test. That is the
    # startup-time resolution proving itself, and its absence proving the fix.
    #
    # 127.0.0.11 is Docker's embedded DNS server, confirmed by reading /etc/resolv.conf inside the
    # running nginx container rather than assuming it. It exists only on user-defined networks; this
    # stack runs on the `ars0n-network` bridge, so it is present.
    #
    # valid=10s caps how long a resolved address is cached, overriding the record's own TTL, so a
    # container recreate self-heals within ten seconds instead of never. ipv6=off stops nginx asking
    # for AAAA records this network does not have; without it every lookup pays for a second query
    # that comes back empty.
    #
    # Side benefit: because the names are no longer resolved at startup, nginx no longer refuses to
    # boot with "host not found in upstream" when api or client happens to be down as nginx starts.
    # ---------------------------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Default is 30s. A lookup that is going to fail should fail fast rather than pinning a client
    # connection open for half a minute.
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 200M;

        # =========================================================================================
        # WHY THE proxy_pass TARGETS BELOW ARE VARIABLES, AND WHY NEITHER ONE SPELLS OUT THE URI.
        #
        # nginx only re-resolves a proxy_pass hostname per request when the target contains a
        # VARIABLE. A literal name, or an `upstream` block, is resolved once at startup. So the
        # `set` lines are what actually activate the `resolver` above - without them it is inert.
        #
        # The trap is what happens to the URI. The rule (verified against this exact nginx by
        # capturing the upstream request line, not just read from the docs) is:
        #
        #   * proxy_pass WITHOUT a URI part  -> nginx forwards the client's original request URI,
        #                                       or the normalized request URI if a `rewrite` changed
        #                                       it. This holds whether or not the host is a
        #                                       variable, so it survives the switch to variables.
        #   * proxy_pass WITH a URI part     -> that URI is used as given. The prefix-substitution
        #                                       behaviour of a literal target (the trailing slash in
        #                                       the old `proxy_pass http://client/;`) is NOT
        #                                       available once a variable is involved.
        #
        # *** DO NOT "FIX" THESE BY APPENDING $uri$is_args$args. *** That is the obvious-looking
        # form and it silently corrupts percent-encoding, because $uri is already decoded and nginx
        # re-escapes it inconsistently. Measured against the old config, with the upstream request
        # line captured on a listener:
        #
        #     request /api/company/foo%20bar   old -> /company/foo%20bar   $uri form -> /company/foo bar
        #     request /api/caf%C3%A9           old -> /caf%C3%A9           $uri form -> /café
        #
        # The first of those is a literal space in the HTTP request line, i.e. a malformed request.
        # The framework does send encoded values in path segments (for example
        # /api/api/company-domains/<id>/<tool>/<encodeURIComponent(domain)>), so this is a live
        # hazard, not a theoretical one.
        #
        # Keeping the rewrite and leaving proxy_pass bare reproduces the old bytes exactly. This was
        # checked for %20, %2B/%26, %C3%A9, query strings, and //.. normalization against both
        # locations, and the upstream request line was identical to the old config in every case.
        # =========================================================================================

        location /api {
            set $api_upstream "http://api:8443";

            # Strips the /api prefix: /api/foo -> /foo. This also marks the URI as changed, which is
            # what makes the bare proxy_pass below forward the rewritten path.
            rewrite ^/api(/.*)$ $1 break;

            # Bare on purpose - see the block comment above. Requests that do not match the rewrite
            # (bare /api, or /apifoo) are forwarded unchanged, which is what the old config did too.
            proxy_pass $api_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            set $client_upstream "http://client:3000";

            # A deliberate no-op rewrite: it leaves the path identical but marks the URI as changed,
            # which selects nginx's "forward the NORMALIZED request URI" behaviour. That is exactly
            # what the old `proxy_pass http://client/;` produced via its trailing slash, and it is
            # not the default here because without a rewrite a bare proxy_pass forwards the client's
            # raw URI instead - which would start passing unnormalized `..` and `//` segments
            # through to the static file server. Verified byte-identical to the old config.
            rewrite ^(.*)$ $1 break;

            proxy_pass $client_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
