  tinja:
    container_name: ars0n-framework-v2-tinja-1
    build: ./docker/tinja
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    # --csti starts a headless Chromium, which needs more than the default 64MB of shared memory.
    shm_size: "1gb"
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  # Open redirect and SSRF. The detector for this section is the nuclei container that already
  # exists; these two only have work to do once it has found something.
  recollapse:
    container_name: ars0n-framework-v2-recollapse-1
    build: ./docker/recollapse
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  ssrfmap:
    container_name: ars0n-framework-v2-ssrfmap-1
    build: ./docker/ssrfmap
    depends_on:
