  gospider:
    container_name: ars0n-framework-v2-gospider-1
    build:
      context: .
      dockerfile: docker/gospider/Dockerfile
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  subdomainizer:
    container_name: ars0n-framework-v2-subdomainizer-1
    build:
      context: .
      dockerfile: docker/subdomainizer/Dockerfile
    depends_on:
