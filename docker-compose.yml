    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  # Command injection and server-side template injection.
  commix:
    container_name: ars0n-framework-v2-commix-1
    build: ./docker/commix
    depends_on:
      - api
    volumes:
      - ./wordlists:/app/wordlists
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
