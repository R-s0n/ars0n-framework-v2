    build: ./docker/lfihunt
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  smugglex:
    container_name: ars0n-framework-v2-smugglex-1
    build: ./docker/smugglex
    depends_on:
