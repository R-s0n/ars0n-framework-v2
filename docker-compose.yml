    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  # The two web cache scanners. Both take a URL rather than a parameter, so the API runs them once
  # per distinct URL rather than once per attack vector.
  wcvs:
    container_name: ars0n-framework-v2-wcvs-1
