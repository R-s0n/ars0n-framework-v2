services:
  nginx:
    container_name: ars0n-framework-v2-nginx-1
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api
      - client
    restart: unless-stopped
    networks:
      - ars0n-network

  api:
    container_name: ars0n-framework-v2-api-1
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Where the positive-control oracle lives. Explicit rather than relying on the
      # compile-time default, so compose and the code cannot disagree about it silently.
      ARS0N_CANARY_HOST: "oracle:8000"
      DATABASE_URL: postgres://postgres:postgres@db:5432/ars0n
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ars0n
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - temp_data:/tmp
      - ./wordlists:/app/wordlists
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    dns_search: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ars0n-network

  ai_service:
    container_name: ars0n-framework-v2-ai-service-1
    build: ./ai_service
    ports:
      - "8000:8000"
    depends_on:
      - api
    environment:
      API_URL: http://api:8443
    restart: unless-stopped
    networks:
      - ars0n-network
    profiles:
      - ai

  db:
    container_name: ars0n-framework-v2-db-1
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ars0n
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ars0n-network

  client:
    container_name: ars0n-framework-v2-client-1
    build: ./client
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ars0n-network

  mcp-server:
    container_name: ars0n-framework-v2-mcp-server-1
    build: ./docker/mcp-server
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ars0n
      MCP_PORT: "3001"
      API_URL: http://api:8443
    restart: unless-stopped
    networks:
      - ars0n-network

  assetfinder:
    container_name: ars0n-framework-v2-assetfinder-1
    build: ./docker/assetfinder
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  metabigor:
    container_name: ars0n-framework-v2-metabigor-1
    build: ./docker/metabigor
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  sublist3r:
    container_name: ars0n-framework-v2-sublist3r-1
    build: ./docker/sublist3r
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  subfinder:
    container_name: ars0n-framework-v2-subfinder-1
    build: ./docker/subfinder
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  shuffledns:
    container_name: ars0n-framework-v2-shuffledns-1
    build: ./docker/shuffledns
    volumes:
      - ./docker/shuffledns/wordlists:/app/wordlists
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  cewl:
    container_name: ars0n-framework-v2-cewl-1
    build: ./docker/cewl
    depends_on:
