  arjun:
    container_name: ars0n-framework-v2-arjun-1
    build: ./docker/arjun
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  x8:
    container_name: ars0n-framework-v2-x8-1
    build: ./docker/x8
    depends_on:
      - api
    volumes:
      # x8 ships no wordlist of its own and reads from stdin when -w is absent, so without a
      # wordlist mounted here every scan tests only x8's 11 built-in custom parameter names.
      # Same mount and same path as the ffuf container, so a path that works in one works in both.
      - ./wordlists:/app/wordlists
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  # The three XSS scanners. All are driven per attack vector by the API through `docker exec`, so
  # they idle here rather than running anything of their own, same as every other tool container.
  dalfox:
    container_name: ars0n-framework-v2-dalfox-1
    build: ./docker/dalfox
    depends_on:
      - api
    volumes:
      # Payload and parameter wordlists reach dalfox through --custom-payload and -W, both of which
      # take a path INSIDE this container. Same mount and same path as ffuf and x8, so a wordlist
      # path that works in one works in all three.
      - ./wordlists:/app/wordlists
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  domdig:
    container_name: ars0n-framework-v2-domdig-1
    build: ./docker/domdig
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    # Chromium needs more than the default 64MB of shared memory or tabs crash on pages of any size,
    # and the crash reads as "target closed" rather than as anything about memory.
    shm_size: "1gb"
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  xssfuzz:
    container_name: ars0n-framework-v2-xssfuzz-1
    build: ./docker/xssfuzz
    depends_on:
      - api
    volumes:
      - ./wordlists:/app/wordlists
      - temp_data:/tmp
    shm_size: "1gb"
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  # The three SQL and NoSQL injection scanners. Driven per attack vector by the API through
  # `docker exec`, so they idle here like every other tool container.
  sqlmap:
    container_name: ars0n-framework-v2-sqlmap-1
    build: ./docker/sqlmap
    depends_on:
      - api
    volumes:
      # Tamper scripts and payload files reach sqlmap through paths INSIDE this container, and its
      # JSON reports are read back off the shared volume, which is why /tmp is mounted.
      - ./wordlists:/app/wordlists
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  ghauri:
    container_name: ars0n-framework-v2-ghauri-1
