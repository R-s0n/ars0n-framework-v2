  sstimap:
    container_name: ars0n-framework-v2-sstimap-1
    build: ./docker/sstimap
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
