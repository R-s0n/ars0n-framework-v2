# Static server for the built SPA, run as the unprivileged nginx user (uid 101). It replaces
# `serve -s build`: same port (3000, where nginx/nginx.conf proxies `/`), same SPA fallback (any path
# that is not a file gets index.html with 200), plus gzip and ETag.
#
# Kept deliberately minimal. `root` and the log paths are static (no variables), and there is no
# alias, rewrite, ssl, http3, aio or ssi, which keeps the medium nginx 1.31.6 CVEs out of reach.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    disable_symlinks on;

    # Non-root: every writable path lives in /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 3000;
        root /usr/share/nginx/html;

        location / {
            try_files $uri /index.html;
        }
    }
}
